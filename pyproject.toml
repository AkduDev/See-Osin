[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "see-osint"
version = "0.2.0"
description = "Modular OSINT framework for phone number and email intelligence with Tor support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AkduDev", email = "akdulayr@gmail.com" },
]
keywords = ["osint", "phone", "email", "security", "reconnaissance", "intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Operating System :: OS Independent",
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0",
    "httpx>=0.27.0",
    "httpx-socks>=0.11.0",
    "phonenumbers>=8.13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "dnspython>=2.4.0",
    "holehe>=1.0",
]

[project.optional-dependencies]
tor = [
    "stem>=1.8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
see = "see.cli:app"

[project.urls]
Homepage = "https://github.com/AkduDev/See-Osin"
Repository = "https://github.com/AkduDev/See-Osin"
Issues = "https://github.com/AkduDev/See-Osin/issues"

[tool.hatch.version]
path = "src/see/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "N", "I", "B", "UP", "S", "A", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]

[tool.coverage.run]
source = ["src/see"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
