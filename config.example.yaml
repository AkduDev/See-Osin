# See OSINT Tool Configuration
# API keys can be set here or via environment variables
# Environment variables take priority over config file values
# See .env.example for available environment variables

# API Keys (leave empty to use environment variables)
api_keys:
  numlookup: ""
  numverify: ""
  abstract: ""
  hunter: ""
  dehashed: ""
  dehashed_email: ""
  hibp: ""

# Tor configuration
tor:
  enabled: false
  socks_port: 9050
  control_port: 9051
  max_requests_per_circuit: 10
  auto_rotate: true

# Default lookup settings
lookup:
  timeout: 30
  retries: 3
  # Domain modules (providers run inside their domain)
  modules:
    - phones

# Output settings
output:
  default_format: "both"
  directory: "./results"

# Rate limiting
rate_limit:
  numverify_per_minute: 10
  # HIBP free tier: ~1 request every 3 seconds
  hibp_delay_seconds: 3.0
